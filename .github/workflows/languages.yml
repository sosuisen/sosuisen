name: Languages card

on:
  schedule:
    - cron: "0 15 * * *" # every day at 0:00 JST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INCLUDE_PRIVATE: "false"
          IGNORED_LANGUAGES: "HTML,CSS"
          LIMIT: "8"
        run: node generate-languages.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || git commit -m "Update languages card"
          git push
